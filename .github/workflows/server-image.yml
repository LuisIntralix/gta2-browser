# Builds the game server image (server/) and pushes it to GHCR, so the droplet
# only pulls it (it has too little RAM to build). D21, deploy/README.md.
name: server-image

on:
  push:
    branches: [main]
    paths: [server/**, .github/workflows/server-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/m1stermo/gta2-server:latest
            ghcr.io/m1stermo/gta2-server:${{ github.sha }}
